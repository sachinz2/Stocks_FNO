name: Falcon CI/CD

# Fixed 2026-08-07: this workflow only ever triggered on a branch called
# "main" -- this repo's actual branch is "master", so it has never fired
# once. The tests/ suite it runs existed the whole time but provided zero
# actual protection as a result (13 of its 30 tests were themselves broken/
# stale, unnoticed for the same reason: nothing was running them).
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # Split lint from tests: this codebase has likely never actually been
  # checked by ruff/black (same reason as above -- the job never ran), so
  # gating tests behind a lint step that might fail for unrelated,
  # pre-existing formatting reasons would bury the one thing that actually
  # matters here. Tests run and report independently of lint.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory only until the codebase has been run through this once
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

  build:
    needs: test
    runs-on: ubuntu-latest
    # Deliberately left as "main" (not "master") -- build/deploy/rollback
    # reference infrastructure that doesn't match reality (wrong server
    # path, no configured DEPLOY_HOST/USER/SSH_KEY/SLACK_WEBHOOK secrets):
    # this keeps them a safe no-op rather than auto-deploying, which the
    # careful manual-verification deploy process used throughout this
    # project was never asked to be replaced by.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.falcon-quant.local
    steps:
      - uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DEPLOY_USER }}/falcon-quant
            git pull origin main
            docker-compose pull
            docker-compose up -d
            sleep 5

      - name: Run health checks
        run: |
          echo "Checking API health..."
          for i in {1..30}; do
            if curl -f http://${{ secrets.DEPLOY_HOST }}:8000/api/v1/health; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting for API to be ready..."
            sleep 2
          done
          echo "❌ Health check failed"
          exit 1

      - name: Verify services
        run: |
          echo "Verifying database..."
          curl -f http://${{ secrets.DEPLOY_HOST }}:8000/api/v1/health || exit 1
          echo "✅ All services verified"

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment successful! Commit: ${{ github.sha }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment failed! Commit: ${{ github.sha }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DEPLOY_USER }}/falcon-quant
            git log --oneline -5
            echo "Rolling back to previous version..."
            git reset --hard HEAD~1
            docker-compose pull
            docker-compose up -d
            echo "✅ Rollback completed"

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '⚠️ Deployment rollback executed for commit: ${{ github.sha }}'
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
